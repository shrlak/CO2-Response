; CO2-Response firmware for the Arduino Uno R4 Minima board with digital sensors
; (SFM3304-D flow on I2C, SprintIR-6S CO2 on Serial1).
;   Build:  pio run -d firmware/r4        Upload:  pio run -d firmware/r4 -t upload
; The sketch lives in ../CO2ResponseR4 so it also opens in the Arduino IDE
; (File > Open > firmware/CO2ResponseR4/CO2ResponseR4.ino, board "Arduino UNO R4 Minima").

[platformio]
src_dir = ../CO2ResponseR4
include_dir = ../CO2ResponseR4
default_envs = uno_r4_minima

[env:uno_r4_minima]
platform = renesas-ra
board = uno_r4_minima
framework = arduino
monitor_speed = 115200
