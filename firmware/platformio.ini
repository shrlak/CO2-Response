; CO2-Response firmware. Build:  pio run -e uno      Upload:  pio run -e uno -t upload
; The sketch lives in CO2Response/ so the same folder also opens in the Arduino IDE
; (File > Open > firmware/CO2Response/CO2Response.ino).

[platformio]
src_dir = CO2Response
include_dir = CO2Response
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit ADS1X15@2.5.0

[env:uno]
platform = atmelavr
board = uno

[env:mega]
platform = atmelavr
board = megaatmega2560

[env:nano]
platform = atmelavr
board = nanoatmega328new
