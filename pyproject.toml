[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "co2response"
dynamic = ["version"]
description = "Research capnography and flow monitor: Arduino + 16-bit ADC + a bedside-style desktop monitor. Research use only."
readme = "README.md"
requires-python = ">=3.10"
# The terminal monitor needs only these; the desktop window is the "desktop" extra:
#   pip install "co2response[desktop] @ git+https://github.com/shrlak/CO2-Response"
dependencies = [
    "numpy>=1.24",
    "pyserial>=3.5",
    "websockets>=11",
    "sounddevice>=0.4.6",
    "textual>=0.80",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.6", "pyqtgraph>=0.13.3"]
dev = ["pytest>=8", "pytest-qt>=4.4", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pypdf>=4"]
analysis = ["pandas>=2.0"]

[project.scripts]
co2response = "co2response.__main__:main"
co2response-tui = "co2response.tui.app:main"

[tool.setuptools.dynamic]
version = { attr = "co2response.__version__" }

[tool.setuptools.packages.find]
include = ["co2response*"]

[tool.setuptools.package-data]
co2response = ["config/*.json", "fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 180
target-version = "py310"
extend-exclude = ["firmware"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I"]
ignore = ["E501", "E731", "B905"]

# Type checking covers the code with no user interface in it: the signal processing,
# the alarm rules, the file format and report, the protocol, the settings and forms,
# and the simulator. Run it with:  mypy
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = [
    "co2response/processing",
    "co2response/alarms",
    "co2response/storage",
    "co2response/sim",
    "co2response/protocol.py",
    "co2response/forms.py",
    "co2response/calibration_draft.py",
    "co2response/connection_form.py",
    "co2response/settings.py",
    "co2response/channels.py",
    "co2response/jsfmt.py",
]

[tool.coverage.run]
source = ["co2response"]
# the browser front end runs only inside Pyodide; tests/test_web.py drives it in Chromium
omit = ["co2response/web/*"]

[tool.coverage.report]
skip_empty = true
