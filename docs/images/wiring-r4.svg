<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1060" width="1280" height="1060" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>CO2-Response Uno R4 board: wiring and gas path with the parts ordered</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#333"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a7d55"/></marker>
    <g id="gnd"><line x1="-9" y1="0" x2="9" y2="0" stroke="#111" stroke-width="2"/><line x1="-6" y1="4" x2="6" y2="4" stroke="#111" stroke-width="2"/><line x1="-3" y1="8" x2="3" y2="8" stroke="#111" stroke-width="2"/></g>
  </defs>
  <style>
    .box { fill: #ffffff; stroke: #333; stroke-width: 1.6; rx: 8; }
    .ard { fill: #e8f4f6; stroke: #00878f; stroke-width: 2; }
    .sens { fill: #fff6e6; stroke: #b36b00; stroke-width: 1.6; }
    .pwr { fill: #fff0ec; stroke: #c0392b; stroke-width: 1.6; }
    .pend { fill: #f4f4f4; stroke: #888; stroke-width: 1.4; stroke-dasharray: 5 4; }
    .t { fill: #111; }
    .b { font-weight: 700; }
    .s { font-size: 11px; fill: #444; }
    .h { font-size: 18px; font-weight: 700; fill: #111; }
    .pin { font-size: 11px; fill: #00585e; font-weight: 700; }
    .w5 { stroke: #d62728; stroke-width: 2.4; fill: none; }
    .wx { stroke: #ff8c00; stroke-width: 2.4; fill: none; }
    .w33 { stroke: #9467bd; stroke-width: 2.4; fill: none; }
    .wg { stroke: #111; stroke-width: 2.2; fill: none; }
    .wi { stroke: #1f77b4; stroke-width: 2.4; fill: none; }
    .wu { stroke: #2ca02c; stroke-width: 2.4; fill: none; }
    .wp { stroke: #e377c2; stroke-width: 2.4; fill: none; }
    .ws { stroke: #7f7f7f; stroke-width: 2.4; fill: none; }
    .usb { stroke: #555; stroke-width: 5; fill: none; stroke-linecap: round; }
    .gas { stroke: #555; stroke-width: 10; fill: none; stroke-linecap: round; }
    .smp { stroke: #0a7d55; stroke-width: 4; fill: none; }
    .lbl { font-size: 11px; font-weight: 700; }
  </style>
  <rect x="0" y="0" width="1280" height="1060" fill="#ffffff"/>
  <text x="24" y="34" class="h">CO2-Response · Uno R4 board, wired with the parts the team ordered</text>
  <text x="24" y="54" class="s">Solid boxes: on the purchase list. Dashed boxes: not ordered yet (requested, or from the lab). Net flags (5V, 5V_EXT, ⏚) join wherever they appear.</text>

  <!-- ===================== A. ELECTRICAL ===================== -->
  <text x="24" y="86" class="h" style="font-size:15px">A · Electrical</text>

  <!-- laptop -->
  <rect x="34" y="100" width="170" height="64" class="box"/>
  <text x="119" y="126" text-anchor="middle" class="t b">Laptop</text>
  <text x="119" y="144" text-anchor="middle" class="s">co2response app · USB</text>
  <path d="M119 164 V232" class="usb"/>
  <text x="128" y="202" class="s">USB cable</text>

  <!-- isolator -->
  <rect x="34" y="232" width="170" height="118" class="box"/>
  <text x="119" y="254" text-anchor="middle" class="t b">USB isolator</text>
  <text x="119" y="270" text-anchor="middle" class="s">Adafruit 2107</text>
  <text x="119" y="284" text-anchor="middle" class="s">ADuM4160 + ADuM5000</text>
  <line x1="119" y1="292" x2="119" y2="346" stroke="#c0392b" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="80" y="312" text-anchor="middle" class="s">computer</text>
  <text x="80" y="325" text-anchor="middle" class="s">side</text>
  <text x="160" y="312" text-anchor="middle" class="s">device</text>
  <text x="160" y="325" text-anchor="middle" class="s">side</text>
  <text x="119" y="366" text-anchor="middle" class="s" fill="#c0392b">isolation barrier</text>
  <text x="119" y="380" text-anchor="middle" class="s">Micro-B: computer · USB-A: Uno</text>
  <text x="119" y="394" text-anchor="middle" class="s">≤100 mA isolated power:</text>
  <text x="119" y="408" text-anchor="middle" class="s">the Uno + SFM3300 only</text>
  <path d="M204 318 H300" class="usb"/>
  <text x="252" y="308" text-anchor="middle" class="s">USB-C</text>

  <!-- Arduino -->
  <rect x="300" y="96" width="260" height="520" rx="10" class="ard"/>
  <text x="430" y="122" text-anchor="middle" class="t b" style="font-size:15px">Arduino UNO R4 Minima</text>
  <text x="430" y="139" text-anchor="middle" class="s">5 V logic · firmware/CO2ResponseR4</text>
  <text x="312" y="322" class="pin">USB-C</text>
  <g text-anchor="end">
    <text x="552" y="164" class="pin">SDA</text>
    <text x="552" y="189" class="pin">SCL</text>
    <text x="552" y="214" class="pin">5V</text>
    <text x="552" y="239" class="pin">GND</text>
    <text x="552" y="274" class="pin">3V3</text>
    <text x="552" y="324" class="pin">D1 (TX1)</text>
    <text x="552" y="354" class="pin">D0 (RX1)</text>
    <text x="552" y="454" class="pin">D10 (PWM)</text>
    <text x="552" y="534" class="pin">D3</text>
    <text x="552" y="564" class="pin">D2 · D8</text>
    <text x="552" y="594" class="pin">D13 LED</text>
  </g>
  <text x="314" y="594" class="s">built-in LED = alarm LED</text>

  <!-- SFM3300 (I2C, 5 V, direct) -->
  <rect x="770" y="140" width="210" height="112" class="sens" rx="8"/>
  <text x="875" y="122" text-anchor="middle" class="t b">Sensirion SFM3300-250-D</text>
  <text x="875" y="134" text-anchor="middle" class="s">flow ±250 L/min · I2C 0x40 · 5 V</text>
  <g class="pin"><text x="778" y="164">SDA</text><text x="778" y="189">SCL</text><text x="778" y="214">VDD</text><text x="778" y="239">GND</text></g>
  <text x="900" y="200" text-anchor="middle" class="s">4-wire lead</text><text x="900" y="214" text-anchor="middle" class="s">(pin order: Sensirion's</text><text x="900" y="228" text-anchor="middle" class="s">connector note)</text>
  <path d="M560 160 H770" class="wi"/><path d="M560 185 H770" class="wi"/>
  <path d="M560 210 H770" class="w5"/><path d="M560 235 H770" class="wg"/>
  <text x="665" y="155" text-anchor="middle" class="lbl" fill="#1f77b4">SDA</text>
  <text x="665" y="180" text-anchor="middle" class="lbl" fill="#1f77b4">SCL (no shifter: both 5 V)</text>
  <text x="700" y="205" text-anchor="middle" class="lbl" fill="#d62728">5V</text>
  <text x="700" y="230" text-anchor="middle" class="lbl">GND</text>
  <text x="620" y="128" class="s">4.7 kΩ pull-ups SDA, SCL → 5V</text>

  <!-- level shifter -->
  <rect x="660" y="282" width="190" height="104" class="box"/>
  <text x="755" y="276" text-anchor="middle" class="t b">BSS138 level shifter (Adafruit 757)</text>
  <g class="pin"><text x="668" y="304">HV</text><text x="668" y="324">B1</text><text x="668" y="354">B2</text><text x="668" y="378">GND</text></g>
  <g class="pin" text-anchor="end"><text x="842" y="304">LV</text><text x="842" y="324">A1</text><text x="842" y="354">A2</text><text x="842" y="378">GND</text></g>
  <text x="755" y="340" text-anchor="middle" class="s">5 V ↔ 3.3 V</text>
  <!-- 5V to HV -->
  <path d="M600 210 V300 H660" class="w5"/><circle cx="600" cy="210" r="4" fill="#d62728"/>
  <!-- 3V3 to LV -->
  <path d="M560 270 H620 V258 H884 V300 H850" class="w33"/>
  <text x="630" y="253" class="lbl" fill="#9467bd">3V3 → LV</text>
  <!-- UART -->
  <path d="M560 320 H660" class="wu" marker-end="url(#arr)"/>
  <path d="M660 350 H560" class="wu" marker-end="url(#arr)"/>
  <text x="610" y="314" text-anchor="middle" class="lbl" fill="#2ca02c">TX</text>
  <text x="610" y="366" text-anchor="middle" class="lbl" fill="#2ca02c">RX</text>
  <use href="#gnd" x="700" y="396"/><path d="M700 386 V396" class="wg"/>

  <!-- SprintIR-R -->
  <rect x="990" y="282" width="250" height="104" class="sens" rx="8"/>
  <text x="1115" y="276" text-anchor="middle" class="t b">GSS SprintIR-R 20 % CO2</text>
  <g class="pin"><text x="998" y="304">VDD</text><text x="998" y="324">Rx_In</text><text x="998" y="354">Tx_Out</text><text x="998" y="378">GND</text></g>
  <text x="1150" y="324" text-anchor="middle" class="s">UART 38400 8N1 · pins 1 Rx_In,</text><text x="1150" y="338" text-anchor="middle" class="s">2 Tx_Out, 3 GND, 4 VDD · 50/s</text>
  <text x="1150" y="338" text-anchor="middle" class="s"></text>
  <text x="1150" y="352" text-anchor="middle" class="s">VDD 3.25–5.5 V · ~21 mA</text>
  <path d="M850 320 H990" class="wu" marker-end="url(#arr)"/>
  <path d="M990 350 H850" class="wu" marker-end="url(#arr)"/>
  <path d="M990 300 H950" class="wx"/>
  <rect x="902" y="290" width="48" height="20" rx="4" fill="#ff8c00"/><text x="926" y="304" text-anchor="middle" class="lbl" fill="#fff">5V_EXT</text>
  <use href="#gnd" x="970" y="396"/><path d="M990 374 H970 V396" class="wg"/>

  <!-- pump driver -->
  <path d="M560 450 H600" class="wp"/>
  <path d="M600 450 l5 -7 l8 14 l8 -14 l8 14 l8 -14 l5 7" class="wp"/>
  <path d="M642 450 H700" class="wp"/>
  <text x="621" y="472" text-anchor="middle" class="s">220 Ω</text>
  <path d="M676 450 V500" class="wp"/><rect x="670" y="476" width="12" height="20" fill="#fff" stroke="#e377c2" stroke-width="2"/>
  <text x="688" y="492" class="s">100 kΩ</text>
  <use href="#gnd" x="676" y="502"/>
  <rect x="700" y="420" width="104" height="66" class="box"/>
  <text x="752" y="442" text-anchor="middle" class="t b">Q1 IRLZ44N</text>
  <text x="752" y="458" text-anchor="middle" class="s">G · D · S</text>
  <text x="752" y="474" text-anchor="middle" class="s">(Q2, Q3 spare)</text>
  <path d="M752 486 V500" class="wg"/><use href="#gnd" x="752" y="500"/>
  <path d="M804 440 H870" class="wg"/><text x="836" y="434" text-anchor="middle" class="s">D → pump −</text>
  <rect x="870" y="414" width="150" height="56" class="box"/>
  <text x="945" y="436" text-anchor="middle" class="t b">Sample pump</text>
  <text x="945" y="452" text-anchor="middle" class="s">ZR370-02PM 4.5 V</text>
  <text x="945" y="464" text-anchor="middle" class="s">PWM duty 140/255 to start</text>
  <path d="M1020 440 H1060" class="wx"/>
  <rect x="1060" y="430" width="48" height="20" rx="4" fill="#ff8c00"/><text x="1084" y="444" text-anchor="middle" class="lbl" fill="#fff">5V_EXT</text>
  <text x="870" y="486" class="s">flyback diode across the pump,</text>
  <text x="870" y="499" class="s">band to + (1N5819 / 1N4001)</text>

  <!-- power -->
  <rect x="1060" y="510" width="190" height="76" class="pwr" rx="8"/>
  <text x="1155" y="532" text-anchor="middle" class="t b">5 V / 2 A wall adapter</text>
  <text x="1155" y="548" text-anchor="middle" class="s">SparkFun TOL-15312 → 2.1 mm</text>
  <text x="1155" y="561" text-anchor="middle" class="s">barrel jack (Adafruit 373)</text>
  <text x="1155" y="577" text-anchor="middle" class="s">+ = 5V_EXT · − = common ⏚</text>
  <path d="M1060 530 H1030" class="wx"/>
  <rect x="982" y="520" width="48" height="20" rx="4" fill="#ff8c00"/><text x="1006" y="534" text-anchor="middle" class="lbl" fill="#fff">5V_EXT</text>
  <path d="M1060 570 H1030 V586" class="wg"/><use href="#gnd" x="1030" y="586"/>
  <text x="1155" y="604" text-anchor="middle" class="s" fill="#c0392b">never to the Uno's 5V or VIN pin</text>

  <!-- reed switch -->
  <path d="M560 530 H700" class="ws"/>
  <rect x="700" y="512" width="200" height="40" class="box"/>
  <text x="800" y="530" text-anchor="middle" class="t b">Reed switch (Adafruit 375)</text>
  <text x="800" y="545" text-anchor="middle" class="s">magnet on the valve handle</text>
  <path d="M900 532 H930 V546" class="wg"/><use href="#gnd" x="930" y="546"/>
  <text x="610" y="524" class="s">INPUT_PULLUP</text>

  <!-- optional -->
  <path d="M560 560 H700" class="ws" stroke-dasharray="6 4"/>
  <rect x="700" y="562" width="270" height="40" class="pend" rx="8"/>
  <text x="835" y="580" text-anchor="middle" class="t">optional: stop/marker button D2 · buzzer D8</text>
  <text x="835" y="595" text-anchor="middle" class="s">each to ⏚ (from the electronics kit)</text>

  <!-- legend -->
  <g transform="translate(34,424)">
    <rect x="0" y="0" width="230" height="196" fill="#fafafa" stroke="#ccc" rx="6"/>
    <text x="10" y="18" class="b">Wires</text>
    <path d="M10 34 H40" class="w5"/><text x="48" y="38" class="s">5V from the Uno (isolated USB)</text>
    <path d="M10 54 H40" class="wx"/><text x="48" y="58" class="s">5V_EXT (wall adapter)</text>
    <path d="M10 74 H40" class="w33"/><text x="48" y="78" class="s">3V3 from the Uno</text>
    <path d="M10 94 H40" class="wg"/><text x="48" y="98" class="s">GND (one common ground)</text>
    <path d="M10 114 H40" class="wi"/><text x="48" y="118" class="s">I2C (flow)</text>
    <path d="M10 134 H40" class="wu"/><text x="48" y="138" class="s">UART (CO2)</text>
    <path d="M10 154 H40" class="wp"/><text x="48" y="158" class="s">PWM gate (pump)</text>
    <path d="M10 174 H40" class="ws"/><text x="48" y="178" class="s">switch input</text>
  </g>

  <!-- ===================== B. GAS PATH ===================== -->
  <line x1="24" y1="636" x2="1256" y2="636" stroke="#ccc"/>
  <text x="24" y="664" class="h" style="font-size:15px">B · Gas path</text>
  <text x="24" y="682" class="s">Main circuit (thick grey) carries the breath; the sample line (green) carries ~150–250 mL/min to the CO2 sensor and back.</text>

  <!-- main line -->
  <path d="M120 760 H1000" class="gas"/>
  <path d="M1000 760 H1060 V720 H1110" class="gas"/>
  <path d="M1060 760 V800 H1110" class="gas"/>

  <rect x="30" y="728" width="90" height="64" class="pend" rx="8"/>
  <text x="75" y="754" text-anchor="middle" class="t b">Subject</text>
  <text x="75" y="770" text-anchor="middle" class="s">mouthpiece</text>
  <text x="75" y="783" text-anchor="middle" class="s">(from mentors)</text>

  <rect x="160" y="736" width="110" height="48" class="box"/>
  <text x="215" y="756" text-anchor="middle" class="t b">Sample port</text>
  <text x="215" y="772" text-anchor="middle" class="s">luer (requested)</text>

  <rect x="320" y="728" width="190" height="64" class="sens" rx="8"/>
  <text x="415" y="752" text-anchor="middle" class="t b">SFM3300-250-D</text>
  <text x="415" y="768" text-anchor="middle" class="s">22 mm male end → subject</text><text x="415" y="782" text-anchor="middle" class="s">(+ = inspiration)</text>
  <text x="415" y="782" text-anchor="middle" class="s"></text>

  <rect x="550" y="736" width="140" height="48" class="box"/>
  <text x="620" y="756" text-anchor="middle" class="t b">½" Sch 40 pipe</text>
  <text x="620" y="772" text-anchor="middle" class="s">Model 22410</text>

  <rect x="720" y="728" width="190" height="64" class="box"/>
  <text x="815" y="748" text-anchor="middle" class="t b">¾×½" reducer bushing</text>
  <text x="815" y="764" text-anchor="middle" class="s">+ ¾" S×FPT adapter</text>
  <text x="815" y="779" text-anchor="middle" class="s">PTFE tape on the threads</text>

  <rect x="930" y="728" width="130" height="64" class="pend" rx="8"/>
  <text x="995" y="748" text-anchor="middle" class="t b">3-way valve</text>
  <text x="995" y="764" text-anchor="middle" class="s">¾" PVC (requested)</text>
  <text x="995" y="779" text-anchor="middle" class="s">magnet → reed D3</text>

  <rect x="1110" y="700" width="140" height="40" class="pend" rx="8"/>
  <text x="1180" y="725" text-anchor="middle" class="t b">Rebreathing bag</text>
  <rect x="1110" y="780" width="140" height="40" class="pend" rx="8"/>
  <text x="1180" y="805" text-anchor="middle" class="t b">Room air</text>

  <!-- sample line -->
  <path d="M215 784 V870" class="smp" marker-end="url(#arrg)"/>
  <rect x="140" y="870" width="150" height="56" class="sens" rx="8"/>
  <text x="215" y="891" text-anchor="middle" class="t b">PTFE filter 0.2 µm</text>
  <text x="215" y="906" text-anchor="middle" class="s">13 mm syringe filter</text>
  <text x="215" y="919" text-anchor="middle" class="s">moisture + bacteria</text>
  <path d="M290 898 H340" class="smp" marker-end="url(#arrg)"/>
  <rect x="340" y="870" width="150" height="56" class="box"/>
  <text x="415" y="891" text-anchor="middle" class="t b">P-859 adapter</text>
  <text x="415" y="906" text-anchor="middle" class="s">female luer lock →</text>
  <text x="415" y="919" text-anchor="middle" class="s">⅛" barb</text>
  <path d="M490 898 H560" class="smp" marker-end="url(#arrg)"/>
  <text x="522" y="884" text-anchor="middle" class="s">silicone</text>
  <text x="522" y="922" text-anchor="middle" class="s">tubing</text>
  <rect x="560" y="870" width="170" height="56" class="sens" rx="8"/>
  <text x="645" y="891" text-anchor="middle" class="t b">SprintIR-R flow cell</text>
  <text x="645" y="906" text-anchor="middle" class="s">CO2 every 20 ms</text>
  <text x="645" y="919" text-anchor="middle" class="s">delay = tube volume ÷ flow</text>
  <path d="M730 898 H790" class="smp" marker-end="url(#arrg)"/>
  <rect x="790" y="870" width="150" height="56" class="box"/>
  <text x="865" y="891" text-anchor="middle" class="t b">Sample pump</text>
  <text x="865" y="906" text-anchor="middle" class="s">ZR370-02PM (Q1, D10)</text>
  <text x="865" y="919" text-anchor="middle" class="s">pulls from the port</text>
  <path d="M940 898 H995 V792" class="smp" marker-end="url(#arrg)"/>
  <text x="1004" y="860" class="s">exhaust back into the</text>
  <text x="1004" y="874" class="s">valve's bag side, so the</text>
  <text x="1004" y="888" class="s">closed circuit keeps its gas</text>

  <rect x="24" y="950" width="1232" height="96" fill="#f7fbff" stroke="#9cc3e6" rx="6"/>
  <text x="36" y="972" class="b">Set-up checks the app helps with</text>
  <text x="36" y="992" class="s">1. Sample flow and flow zero: cap the mouthpiece with the pump on. All the pump's flow then goes through the SFM3300, so the flow it shows is the sample flow (aim for 0.15–0.25 L/min:</text>
  <text x="50" y="1006" class="s">change PUMP_DUTY or send "PUMP 120"). Zero the flow there: the pump's draw is removed from every breath. The in-depth analysis reports any flow bias left.</text>
  <text x="36" y="1024" class="s">2. CO2 delay: the sample line makes the CO2 lag the flow. The in-depth analysis measures it from a recording; put (that − 0.2 s) into Settings › Processing › CO2 delay.</text>
  <text x="36" y="1040" class="s">3. CO2 zero: sample line in fresh air for a minute, pump on, then Settings › Connection › Zero in room air (sends CO2ZERO AIR to the SprintIR-R).</text>
</svg>
