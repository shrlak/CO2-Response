name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Web (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: Browser smoke tests (simulator mode)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/test-results
          retention-days: 7

  bridge:
    name: Python bridge (syntax + simulate smoke test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile serial_ws_bridge.py
      - name: Relay simulated lines over WebSocket
        run: |
          python serial_ws_bridge.py --simulate &
          sleep 2
          python - <<'PY'
          import asyncio, websockets
          async def main():
              async with websockets.connect("ws://127.0.0.1:8765") as ws:
                  await ws.send("INFO")
                  lines = [await asyncio.wait_for(ws.recv(), 3) for _ in range(50)]
              assert any(l.startswith("I,FW") for l in lines), lines[:5]
              data = [l for l in lines if l.startswith("D,")]
              assert len(data) > 30, len(data)
              for l in data:
                  payload, cs = l[1:].split("*")
                  x = 0
                  for ch in payload.encode():
                      x ^= ch
                  assert f"{x:02X}" == cs, l
              print("bridge OK:", len(data), "valid data lines")
          asyncio.run(main())
          PY

  firmware:
    name: Firmware (PlatformIO build + line-format test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Native line-format test
        run: g++ -std=c++11 -Wall -Wextra -Werror -I CO2Response test/test_line_format.cpp -o line_test && ./line_test
      - run: pio run -e uno -e mega -e nano
