name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (lint, tests, headless UI) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt and audio system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - name: The command-line entry point starts
        run: python -m co2response --version

  web:
    name: Browser build (GitHub Pages site in Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py dist/site
      - run: |
          pip install pytest playwright
          python -m playwright install --with-deps chromium
      - name: Boot the site under Pyodide and drive it (simulator, Web Serial, record, review, settings)
        run: pytest -q tests/test_web.py

  bridge:
    name: Python bridge smoke test + analysis loader
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m py_compile serial_ws_bridge.py
      - name: Relay simulated lines over WebSocket
        run: |
          python serial_ws_bridge.py --simulate &
          sleep 2
          python - <<'PY'
          import asyncio, websockets
          async def main():
              async with websockets.connect("ws://127.0.0.1:8765") as ws:
                  await ws.send("INFO")
                  lines = [await asyncio.wait_for(ws.recv(), 3) for _ in range(50)]
              assert any(l.startswith("I,FW") for l in lines), lines[:5]
              data = [l for l in lines if l.startswith("D,")]
              assert len(data) > 30, len(data)
              for l in data:
                  payload, cs = l[1:].split("*")
                  x = 0
                  for ch in payload.encode():
                      x ^= ch
                  assert f"{x:02X}" == cs, l
              print("bridge OK:", len(data), "valid data lines")
          asyncio.run(main())
          PY
      - name: The monitor's bridge client reads the relay
        working-directory: .
        run: |
          python bridge/serial_ws_bridge.py --simulate --ws-port 8766 &
          sleep 2
          python - <<'PY'
          import time
          from co2response.sources.bridge import BridgeSource
          src = BridgeSource("ws://127.0.0.1:8766")
          src.start()
          src.send("INFO")
          lines, t0 = [], time.time()
          while time.time() - t0 < 3:
              lines += [x for x in src.poll() if isinstance(x, str)]
              time.sleep(0.05)
          src.stop()
          assert sum(l.startswith("D,") for l in lines) > 100, len(lines)
          print("bridge client OK:", len(lines), "lines")
          PY
      - name: Analysis loader reads the sample session
        run: |
          pip install -r ../analysis/requirements.txt
          python ../analysis/load_session.py ../sample-data/synthetic_session.csv --breaths /tmp/breaths.csv
          test "$(wc -l < /tmp/breaths.csv)" -gt 10

  firmware:
    name: Firmware (PlatformIO build + line-format test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Native line-format test
        run: g++ -std=c++11 -Wall -Wextra -Werror -I CO2Response test/test_line_format.cpp -o line_test && ./line_test
      - run: pio run -e uno -e mega -e nano
