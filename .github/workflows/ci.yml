name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  app:
    name: App (lint, tests, headless UI) · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt and audio system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - name: Type check (the code with no user interface in it; see [tool.mypy] in pyproject.toml)
        run: mypy
      - name: Tests, with coverage (fails under 80 %)
        run: pytest -q --cov --cov-report=term-missing:skip-covered --cov-fail-under=80
      - name: Coverage table in the run summary
        if: runner.os == 'Linux'
        run: |
          { echo '### Test coverage'; echo '```'; python -m coverage report; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: The command-line entry point starts
        run: python -m co2response --version

  web:
    name: Browser build (GitHub Pages site in Chromium)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/build_site.py dist/site
      - run: |
          pip install pytest playwright -e python   # co2r: the monitor on a Python acquisition server
          python -m playwright install --with-deps chromium
      - name: Boot the site under Pyodide and drive it (simulator, Web Serial, record, review, settings)
        run: pytest -q tests/test_web.py

  python:
    name: Acquisition package (co2r) · Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        python: ['3.9', '3.10', '3.11', '3.12', '3.13']
        include:
          - { os: windows-latest, python: '3.9' }
          - { os: windows-latest, python: '3.13' }
          - { os: macos-latest, python: '3.10' }
          - { os: macos-latest, python: '3.13' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e "python[test]"
      - run: python -m pytest python/tests -q
      - name: Command line works
        run: |
          co2r-daq drivers
          co2r-daq check --driver simulated --seconds 2
          python analysis/load_session.py sample-data/synthetic_session.csv --breaths breaths.csv

  python-oldest:
    name: Acquisition package (co2r) · Python 3.9, oldest supported packages
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: pip install -e python "websockets==11.0.3" "pyserial==3.5" "pandas==2.0.3" "numpy<2" pytest
      - run: python -m pytest python/tests -q

  bridge:
    name: Legacy bridge script (relay smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r bridge/requirements.txt
      - name: bridge/serial_ws_bridge.py --simulate serves valid lines
        run: |
          python bridge/serial_ws_bridge.py --simulate &
          BP=$!
          trap 'kill $BP' EXIT
          sleep 3
          python - <<'PY'
          import asyncio, websockets
          async def main():
              lines = []
              async with websockets.connect("ws://127.0.0.1:8765") as ws:
                  await ws.send("INFO")
                  while len(lines) < 100:
                      lines += str(await asyncio.wait_for(ws.recv(), 3)).split("\n")  # several lines per message
              assert any(l.startswith("I,FW,co2r-py-") for l in lines), lines[:5]
              data = [l for l in lines if l.startswith("D,")]
              assert len(data) > 50, len(data)
              for l in data:
                  payload, cs = l[1:].split("*")
                  x = 0
                  for ch in payload.encode():
                      x ^= ch
                  assert f"{x:02X}" == cs, l
              print("bridge OK:", len(data), "valid data lines")
          asyncio.run(main())
          PY

  firmware:
    name: Firmware (PlatformIO build + line-format test)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: firmware
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/platformio.ini', 'firmware/r4/platformio.ini') }}
      - run: pip install platformio==6.2.0
      - name: Native line-format test
        run: g++ -std=c++11 -Wall -Wextra -Werror -I CO2Response test/test_line_format.cpp -o line_test && ./line_test
      - run: pio run -e uno -e mega -e nano
      - name: Uno R4 Minima firmware (SFM3304-D flow + SprintIR CO2)
        run: pio run -d r4
