# Builds the standalone desktop app (no Python needed on the computer) for Windows,
# macOS and Linux with PyInstaller, and checks that each built program really runs:
# it writes a report from the sample session and runs the simulator for a few seconds.
#
# - Pushing a tag like v0.4.0 builds the three apps and attaches them to a GitHub Release.
# - "Run workflow" on the Actions tab builds them as downloadable artifacts only.
# - A pull request that touches the packaging files builds them too, as a check.
name: Standalone apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths:
      - 'packaging/**'
      - '.github/workflows/release.yml'
      - 'requirements.txt'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  build:
    name: Build · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: Windows, archive: CO2-Response-Windows.zip, terminal: CO2-Response-Terminal-Windows.zip }
          - { os: macos-latest, name: macOS, archive: CO2-Response-macOS.zip, terminal: CO2-Response-Terminal-macOS.zip }
          - { os: ubuntu-24.04, name: Linux, archive: CO2-Response-Linux.tar.gz, terminal: CO2-Response-Terminal-Linux.tar.gz }
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Qt and audio system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2
      - run: pip install -r requirements.txt pyinstaller
      - name: Build the app
        run: pyinstaller --noconfirm packaging/CO2-Response.spec
      - name: The built app runs (report from the sample session, then the simulator for 12 s)
        run: |
          APP=dist/CO2-Response/CO2-Response
          [ "$RUNNER_OS" = "Windows" ] && APP="$APP.exe"
          export CO2R_HOME="$RUNNER_TEMP/co2r-home"
          "$APP" --report sample-data/synthetic_session.csv --out "$RUNNER_TEMP/report.pdf"
          head -c 8 "$RUNNER_TEMP/report.pdf" | grep -q '%PDF-1.4'
          "$APP" --sim --exit-after 12
      - name: Pack it
        run: |
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a -bso0 "${{ matrix.archive }}" CO2-Response ;;
            macOS) ditto -c -k --keepParent CO2-Response.app "${{ matrix.archive }}" ;;
            *) tar czf "${{ matrix.archive }}" CO2-Response ;;
          esac
          ls -l "${{ matrix.archive }}"
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.archive }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error
      # the terminal monitor: one program file, no Qt
      - name: Build the terminal program
        run: pip install textual && pyinstaller --noconfirm packaging/CO2-Response-Terminal.spec
      - name: The terminal program runs (a whole simulated test with its report)
        run: |
          APP=dist/co2response-terminal
          [ "$RUNNER_OS" = "Windows" ] && APP="$APP.exe"
          export CO2R_HOME="$RUNNER_TEMP/co2r-home-t"
          "$APP" --fast-test normal --sessions "$RUNNER_TEMP/sessions"
          ls "$RUNNER_TEMP"/sessions/*.pdf
      - name: Pack the terminal program
        run: |
          cd dist
          case "$RUNNER_OS" in
            Windows) 7z a -bso0 "${{ matrix.terminal }}" co2response-terminal.exe ;;
            macOS) ditto -c -k co2response-terminal "${{ matrix.terminal }}" ;;
            *) tar czf "${{ matrix.terminal }}" co2response-terminal ;;
          esac
      - uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.terminal }}
          path: dist/${{ matrix.terminal }}
          if-no-files-found: error

  release:
    name: Attach to the GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: apps
          merge-multiple: true
      - name: Create the release with the three apps
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" apps/* --repo "$GITHUB_REPOSITORY" --title "CO2-Response $GITHUB_REF_NAME" --generate-notes
          --notes "Standalone apps: unzip and run CO2-Response (the desktop window) or co2response-terminal (the monitor full-screen in a terminal). Research use only; not a medical device. On macOS the app is not signed: right-click it and choose Open the first time."
